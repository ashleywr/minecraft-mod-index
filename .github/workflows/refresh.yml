name: Refresh mod index

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-mod-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Refresh release metadata and documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh.py
      - name: Commit refreshed index
        run: |
          if git diff --quiet -- README.md catalog.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md catalog.json
          git commit -m 'Refresh mod releases and dependency index'
          git push
